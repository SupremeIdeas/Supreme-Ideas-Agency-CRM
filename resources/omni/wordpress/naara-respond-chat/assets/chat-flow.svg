<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="nrc-t nrc-d" fill="none">
  <title id="nrc-t">Your WordPress site, the Naara chat bubble and your Naara Respond inbox</title>
  <desc id="nrc-d">A visitor on a WordPress site opens the chat bubble. Their message travels to your Naara Respond inbox, where it sits next to WhatsApp, Instagram, Telegram, SMS and email conversations.</desc>
  <defs>
    <linearGradient id="nrc-bg" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#0A3F4A"/></linearGradient>
    <linearGradient id="nrc-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12A3A3"/><stop offset="1" stop-color="#0A6E6E"/></linearGradient>
    <linearGradient id="nrc-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2C14E"/><stop offset="1" stop-color="#D4A017"/></linearGradient>
    <linearGradient id="nrc-ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".45" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient>
    <linearGradient id="nrc-flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#12A3A3"/></linearGradient>
    <filter id="nrc-sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="nrc-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 8 5 1 8.5" stroke="#12A3A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="640" height="300" rx="22" fill="url(#nrc-bg)"/>
  <circle cx="560" cy="40" r="90" fill="#12A3A3" opacity=".08"/>
  <circle cx="70" cy="270" r="80" fill="#D4A017" opacity=".07"/>

  <!-- WordPress site -->
  <g filter="url(#nrc-sh)">
    <rect x="28" y="48" width="236" height="190" rx="14" fill="#F7FAFB"/>
    <path d="M28 62a14 14 0 0 1 14-14h208a14 14 0 0 1 14 14v18H28z" fill="#E3EAEE"/>
    <circle cx="46" cy="64" r="4" fill="#F08080"/><circle cx="60" cy="64" r="4" fill="#F2C14E"/><circle cx="74" cy="64" r="4" fill="#5FC98A"/>
    <rect x="92" y="58" width="150" height="12" rx="6" fill="#fff"/>
    <circle cx="101" cy="64" r="3" fill="#0A6E6E"/><rect x="109" y="62" width="80" height="4" rx="2" fill="#C9D4DA"/>
    <rect x="44" y="96" width="120" height="12" rx="6" fill="#0D1B2A" opacity=".85"/>
    <rect x="44" y="118" width="196" height="7" rx="3.5" fill="#C9D4DA"/>
    <rect x="44" y="132" width="176" height="7" rx="3.5" fill="#C9D4DA"/>
    <rect x="44" y="146" width="188" height="7" rx="3.5" fill="#C9D4DA"/>
    <rect x="44" y="168" width="84" height="44" rx="8" fill="#DDE7EA"/><rect x="138" y="168" width="84" height="44" rx="8" fill="#DDE7EA"/>
    <!-- open chat window -->
    <g>
      <rect x="150" y="100" width="104" height="92" rx="12" fill="#fff" stroke="#D3DDE2"/>
      <path d="M150 112a12 12 0 0 1 12-12h80a12 12 0 0 1 12 12v12H150z" fill="url(#nrc-teal)"/>
      <rect x="160" y="108" width="44" height="6" rx="3" fill="#fff"/><rect x="160" y="117" width="28" height="4" rx="2" fill="#fff" opacity=".7"/>
      <rect x="160" y="132" width="58" height="14" rx="7" fill="#EAF0F2"/>
      <rect x="196" y="152" width="48" height="14" rx="7" fill="url(#nrc-teal)"/>
      <rect x="160" y="172" width="62" height="12" rx="6" fill="#F3F6F7" stroke="#D3DDE2"/>
      <path d="M232 178l8-3-3 8-1.4-3.2z" fill="#0A6E6E"/>
    </g>
    <!-- bubble button -->
    <circle cx="232" cy="218" r="17" fill="url(#nrc-teal)"/>
    <path d="M225 213.5a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v2.5a6 6 0 0 1-6 6h-3.4l-3.4 2.6v-2.9a6 6 0 0 1-1.2-3.5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="146" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#E8F3F3">Your WordPress site</text>

  <!-- flow -->
  <path d="M276 140 C318 120 330 120 372 140" stroke="url(#nrc-flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#nrc-ar)"/>
  <g>
    <rect x="296" y="116" width="56" height="26" rx="13" fill="url(#nrc-gold)"/>
    <text x="324" y="133.5" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="800" fill="#0D1B2A">hello!</text>
  </g>
  <text x="324" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="11" fill="#9FC4C7">one line of code</text>
  <text x="324" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="11" fill="#9FC4C7">no data kept here</text>

  <!-- Naara inbox -->
  <g filter="url(#nrc-sh)">
    <rect x="384" y="36" width="228" height="214" rx="14" fill="#102536" stroke="#1D4252"/>
    <rect x="384" y="36" width="228" height="34" rx="14" fill="#14303F"/><rect x="384" y="56" width="228" height="14" fill="#14303F"/>
    <text x="400" y="58" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="800" fill="#fff">Naara Respond inbox</text>
    <circle cx="594" cy="53" r="5" fill="#5FC98A"/>
    <!-- rows -->
    <g font-family="system-ui,Segoe UI,Roboto,sans-serif">
      <g><rect x="396" y="80" width="204" height="30" rx="9" fill="url(#nrc-teal)" opacity=".28"/><rect x="396" y="80" width="204" height="30" rx="9" stroke="#12A3A3"/>
        <circle cx="414" cy="95" r="9" fill="url(#nrc-teal)"/><path d="M410 93a3.6 3.6 0 0 1 3.6-3.6h1.6a3.6 3.6 0 0 1 3.6 3.6v1.6a3.6 3.6 0 0 1-3.6 3.6h-2l-2 1.6v-1.8a3.6 3.6 0 0 1-1.2-2.4z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
        <text x="430" y="92" font-size="10.5" font-weight="800" fill="#fff">Website chat</text><text x="430" y="104" font-size="9.5" fill="#B9DADD">hello! can you help me?</text>
        <rect x="570" y="86" width="22" height="13" rx="6.5" fill="url(#nrc-gold)"/><text x="581" y="96" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0D1B2A">NEW</text></g>
      <g><rect x="396" y="118" width="204" height="28" rx="9" fill="#14303F"/>
        <circle cx="414" cy="132" r="9" fill="#25D366"/><path d="M410.4 135.2l.9-2.2a4 4 0 1 1 1.3 1.3z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
        <text x="430" y="129" font-size="10.5" font-weight="700" fill="#E8F3F3">WhatsApp</text><text x="430" y="140" font-size="9.5" fill="#8FB3B8">Is the red one in stock?</text></g>
      <g><rect x="396" y="152" width="204" height="28" rx="9" fill="#14303F"/>
        <circle cx="414" cy="166" r="9" fill="url(#nrc-ig)"/><rect x="409.6" y="161.6" width="8.8" height="8.8" rx="2.6" stroke="#fff" stroke-width="1.2"/><circle cx="414" cy="166" r="2" stroke="#fff" stroke-width="1.2"/>
        <text x="430" y="163" font-size="10.5" font-weight="700" fill="#E8F3F3">Instagram</text><text x="430" y="174" font-size="9.5" fill="#8FB3B8">Do you ship to Accra?</text></g>
      <g><rect x="396" y="186" width="204" height="28" rx="9" fill="#14303F"/>
        <circle cx="414" cy="200" r="9" fill="#2AABEE"/><path d="M409.6 200.2l8.6-3.4-1.5 8.6-3.2-2.3-1.6 1.5-.4-2.4z" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
        <text x="430" y="197" font-size="10.5" font-weight="700" fill="#E8F3F3">Telegram</text><text x="430" y="208" font-size="9.5" fill="#8FB3B8">Thanks, that worked!</text></g>
      <g transform="translate(396 220)"><circle cx="18" cy="0" r="0"/></g>
    </g>
    <!-- channel dots -->
    <g>
      <circle cx="420" cy="232" r="6.5" fill="#25D366"/><circle cx="440" cy="232" r="6.5" fill="url(#nrc-ig)"/><circle cx="460" cy="232" r="6.5" fill="#2AABEE"/><circle cx="480" cy="232" r="6.5" fill="url(#nrc-teal)"/><circle cx="500" cy="232" r="6.5" fill="url(#nrc-gold)"/>
      <text x="516" y="236" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="10" fill="#8FB3B8">+ SMS, email</text>
    </g>
  </g>
  <text x="498" y="278" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#E8F3F3">One inbox for every channel</text>
</svg>
