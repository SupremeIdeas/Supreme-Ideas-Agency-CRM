<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="A brand storefront in a spotlight with followers and a megaphone">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13A39B"/><stop offset="1" stop-color="#0A6E6E"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2CB5C"/><stop offset="1" stop-color="#D4A017"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3A52"/><stop offset="1" stop-color="#0D1B2A"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4FD1C5" stop-opacity=".4"/><stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0D1B2A" flood-opacity=".28"/></filter>
</defs>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2CB5C" stop-opacity=".55"/><stop offset="1" stop-color="#F2CB5C" stop-opacity="0"/></linearGradient>
<circle cx="240" cy="170" r="150" fill="url(#glow)"/>
<ellipse cx="240" cy="298" rx="170" ry="14" fill="#0D1B2A" opacity=".1"/>
<!-- spotlight -->
<path d="M240 -4l-110 232h220z" fill="url(#beam)"/>
<!-- storefront -->
<g filter="url(#sh)"><rect x="150" y="136" width="180" height="150" rx="10" fill="#fff"/></g>
<path d="M140 136l14-52h172l14 52z" fill="url(#g1)"/>
<g><path d="M140 136h40v16c0 10-8 14-20 14s-20-4-20-14z" fill="#0A6E6E"/><path d="M180 136h40v16c0 10-8 14-20 14s-20-4-20-14z" fill="#F2CB5C"/><path d="M220 136h40v16c0 10-8 14-20 14s-20-4-20-14z" fill="#0A6E6E"/><path d="M260 136h40v16c0 10-8 14-20 14s-20-4-20-14z" fill="#F2CB5C"/><path d="M300 136h40v16c0 10-8 14-20 14s-20-4-20-14z" fill="#0A6E6E"/></g>
<rect x="166" y="92" width="148" height="30" rx="8" fill="#0D1B2A"/>
<text x="240" y="113" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#F2CB5C" letter-spacing="1.5">YOUR BRAND</text>
<rect x="168" y="182" width="68" height="104" rx="6" fill="#CFE0E4"/><rect x="176" y="190" width="52" height="40" rx="4" fill="#A8EDE6"/><circle cx="224" cy="248" r="3" fill="#D4A017"/>
<rect x="250" y="182" width="64" height="58" rx="8" fill="#F3FAF9" stroke="#CFE0E4" stroke-width="2"/>
<rect x="258" y="192" width="48" height="8" rx="4" fill="#0A6E6E"/><rect x="258" y="206" width="34" height="6" rx="3" fill="#9FB3C6"/><rect x="258" y="218" width="42" height="6" rx="3" fill="#CFE0E4"/>
<rect x="250" y="250" width="64" height="24" rx="12" fill="url(#g2)"/><text x="282" y="267" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#0D1B2A">FOLLOW</text>
<!-- followers bubble -->
<g filter="url(#sh)"><rect x="46" y="120" width="104" height="44" rx="22" fill="#fff"/></g>
<path d="M76 142c-4-6-12-2-8 5 2 4 8 8 8 8s6-4 8-8c4-7-4-11-8-5z" fill="#E5484D"/>
<text x="94" y="147" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0D1B2A">+1,280</text>
<!-- rewards coin -->
<g filter="url(#sh)"><circle cx="400" cy="130" r="34" fill="url(#g2)"/></g><circle cx="400" cy="130" r="26" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
<text x="400" y="139" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#0D1B2A">5</text>
<!-- megaphone -->
<g transform="rotate(-14 90 230)" filter="url(#sh)"><path d="M58 206l70-30v110l-70-30z" fill="url(#g1)"/><rect x="42" y="206" width="26" height="50" rx="8" fill="#0A6E6E"/><path d="M128 176c14 8 22 24 22 54s-8 46-22 54z" fill="#F2CB5C"/><path d="M70 256l8 36h18l-8-34z" fill="#0D1B2A"/></g>
<g fill="none" stroke="#D4A017" stroke-width="3.4" stroke-linecap="round"><path d="M170 190c8 6 8 30 0 36" transform="translate(-6 0)"/><path d="M184 178c14 12 14 50 0 62" transform="translate(-4 0)" opacity=".7"/></g>
<g fill="#F2CB5C"><circle cx="440" cy="60" r="4"/><circle cx="40" cy="70" r="3.5"/><circle cx="430" cy="250" r="3"/></g><g fill="#4FD1C5"><circle cx="60" cy="40" r="3"/><circle cx="454" cy="196" r="4"/></g>
<path d="M404 60l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#D4A017"/>
</svg>
