<rect x="190" y="68" width="100" height="42" rx="12" fill="url(#g1)"/>
<text x="240" y="86" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="#A8EDE6" letter-spacing="1.2">YOUR CODE</text>
