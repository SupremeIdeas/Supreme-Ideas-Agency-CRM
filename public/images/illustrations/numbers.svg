<g fill="#0D1B2A" opacity=".55"><circle cx="206" cy="143" r="3"/><circle cx="240" cy="143" r="3"/><circle cx="274" cy="143" r="3"/><circle cx="206" cy="175" r="3"/><circle cx="240" cy="175" r="3"/><circle cx="274" cy="175" r="3"/><circle cx="206" cy="207" r="3"/><circle cx="240" cy="207" r="3"/><circle cx="274" cy="207" r="3"/></g>
<rect x="226" y="236" width="28" height="30" rx="14" fill="url(#g2)"/><path d="M233 252l5 5 9-11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
