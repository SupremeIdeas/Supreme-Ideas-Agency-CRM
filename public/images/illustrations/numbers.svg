<rect x="64" y="112" width="84" height="8" rx="4" fill="#0A6E6E"/><rect x="64" y="128" width="58" height="7" rx="3.5" fill="#9FB3C6"/><rect x="64" y="142" width="70" height="7" rx="3.5" fill="#CFE0E4"/>
