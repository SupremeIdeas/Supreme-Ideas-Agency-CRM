<g fill="#F2CB5C"><circle cx="40" cy="230" r="4"/><circle cx="450" cy="40" r="3.5"/></g><g fill="#4FD1C5"><circle cx="84" cy="52" r="4"/><circle cx="440" cy="210" r="3"/></g>
